map $request_method $write_limit_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
limit_req_zone  $write_limit_key    zone=writes:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 8k;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Real-IP;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/api/[a-z]+/(actuator|products/[^/]+/restock) {
        return 404;
    }

    location /api/order/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=writes burst=10 nodelay;
        set $upstream order-service:8081;
        rewrite ^/api/order/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/payment/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=writes burst=10 nodelay;
        set $upstream payment-service:8082;
        rewrite ^/api/payment/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/inventory/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=writes burst=10 nodelay;
        set $upstream inventory-service:8083;
        rewrite ^/api/inventory/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/orchestrator/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=writes burst=10 nodelay;
        set $upstream saga-orchestrator:8084;
        rewrite ^/api/orchestrator/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location = /api/orchestrator/stream {
        limit_conn perip 4;
        set $upstream saga-orchestrator:8084;
        rewrite ^ /stream break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
