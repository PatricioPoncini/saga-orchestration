server {
    listen 80;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri /index.html;
    }

    location /api/order/ {
        set $upstream order-service:8081;
        rewrite ^/api/order/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/payment/ {
        set $upstream payment-service:8082;
        rewrite ^/api/payment/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/inventory/ {
        set $upstream inventory-service:8083;
        rewrite ^/api/inventory/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }
    location /api/orchestrator/ {
        set $upstream saga-orchestrator:8084;
        rewrite ^/api/orchestrator/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location = /api/orchestrator/stream {
        set $upstream saga-orchestrator:8084;
        rewrite ^ /stream break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
