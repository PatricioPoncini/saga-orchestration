server:
  port: ${PORT:8081}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:saga}
    password: ${DB_PASSWORD:saga}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        concurrency: 4
        max-concurrency: 16
        prefetch: 50
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

demo:
  reset:
    interval: ${DEMO_RESET_INTERVAL:15m}
    purge-queues: order.commands
