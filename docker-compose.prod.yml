name: sagalab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  restart: unless-stopped
  logging: *logging
  mem_limit: 512m
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-env: &env
  DB_USER: saga
  DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
  RABBIT_HOST: rabbitmq
  RABBIT_USER: saga
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:?Falta RABBIT_PASSWORD en .env}
  DEMO_RESET_INTERVAL: ${DEMO_RESET_INTERVAL:-15m}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Falta ACME_EMAIL en .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [ui]

  ui:
    build: ./ui
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    networks: [edge, backend]
    depends_on: [order-service, payment-service, inventory-service, saga-orchestrator]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      POSTGRES_DB: saga
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: saga
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Falta RABBIT_PASSWORD en .env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  order-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: order-service }
    environment:
      <<: *env
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/orders

  payment-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: payment-service }
    environment:
      <<: *env
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/payments

  inventory-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: inventory-service }
    environment:
      <<: *env
      PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/inventory

  saga-orchestrator:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: saga-orchestrator }
    environment:
      <<: *env
      PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/orchestrator

networks:
  edge: {}
  backend:
    internal: true

volumes:
  pgdata:
  rabbitdata:
  caddy-data:
  caddy-config:
